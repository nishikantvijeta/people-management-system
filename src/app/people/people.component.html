<div class="container-fluid g-0 p-2">

    <div class="row g-0">

        <div class="col ps-2">

            <div class="row g-0">

                <div class="col-md-12 text-center">
                    <span class="name">{{people.name | titlecase}}</span>
                </div>

                <div class="col-md-2 d-flex justify-content-center align-items-center">
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-outline-success"
                            (click)="editPeopleClicked()">Edit</button>
                        <button type="button" class="btn btn-outline-danger"
                            (click)="deletePeopleClicked()">Delete</button>
                    </div>
                </div>

            </div>

            <div class="row g-0 mt-3">

                <div class="col-md">

                    <table class="table table-hover mx-auto">
                        <thead class="text-center fs-5 fst-italic text-secondary">
                            <tr>
                                <td colspan="2">Personal Details</td>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Age</td>
                                <td>{{people.age}}</td> <!-- Age field -->
                            </tr>

                            <tr>
                                <td>Gender</td>
                                <td>{{people.gender == 'm' ? "Male" : "Female"}}</td> <!-- Gender field -->
                            </tr>
                            <tr>
                                <td>Mobile No</td>
                                <td>{{people.mobileNo}}</td> <!-- Mobile No field -->
                            </tr> 
                        </tbody>
                    </table>

                </div>

            </div>

        </div>

    </div>

</div>
